name: Build APK

on:
  push:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build YaMa Launcher APK
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: build/app/outputs/flutter-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Regenerate code and test mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze app code
        run: |
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          # Surface each error as an annotation (readable without log access).
          python3 - <<'PY'
          import re
          count = 0
          for line in open("analyze.txt", encoding="utf-8", errors="replace"):
              if "error" not in line or "•" not in line:
                  continue
              parts = [p.strip() for p in line.split("•")]
              if len(parts) < 3 or not parts[0].endswith("error"):
                  continue
              message, location = parts[1], parts[2]
              m = re.match(r"(.+?):(\d+):(\d+)", location)
              if m:
                  print(f"::error file={m.group(1)},line={m.group(2)},col={m.group(3)}::{message}")
              else:
                  print(f"::error::{message} ({location})")
              count += 1
              if count >= 45:
                  break
          PY
          tail -n 3 analyze.txt
          exit $code

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }} --build-name 1.0.${{ github.run_number }}

      - name: Rename APKs
        run: |
          cd "$OUTPUT_DIR"
          for f in app-*release.apk; do mv "$f" "yama-launcher-${f#app-}"; done
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yama-launcher-apk
          path: ${{ env.OUTPUT_DIR }}/yama-launcher-*.apk
          retention-days: 30
