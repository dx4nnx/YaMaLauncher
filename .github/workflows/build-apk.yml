name: Build APK

on:
  push:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build YaMa Launcher APK
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: build/app/outputs/flutter-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Regenerate code and test mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }} --build-name 1.0.${{ github.run_number }}

      - name: Rename APKs
        run: |
          cd "$OUTPUT_DIR"
          for f in app-*release.apk; do mv "$f" "yama-launcher-${f#app-}"; done
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yama-launcher-apk
          path: ${{ env.OUTPUT_DIR }}/yama-launcher-*.apk
          retention-days: 30
