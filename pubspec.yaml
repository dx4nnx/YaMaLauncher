name: flauncher
description: YaMa Launcher, a glassy Android TV / Fire TV launcher based on FLauncher.

version: 2024.11.001+15

environment:
  sdk: ">=3.4.3"
  flutter: 3.24.5

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  intl: any
  drift: ^2.14.1
  drift_local_storage_inspector: ^0.7.0
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^7.0.0
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.13
  tuple: ^2.0.2
  flutter_localizations:
    sdk: flutter
  format: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  flutter_lints: ^5.0.0
  mockito: ^5.3.2
  drift_dev: ^2.5.2
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Regular.ttf
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700

